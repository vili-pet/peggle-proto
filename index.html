<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peggle Proto | Telegram Mini App</title>
<style>
  body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
    min-height: 100vh;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
    color: #e0e7ff;
  }
  .subtitle {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
  }
  canvas {
    border: 4px solid #334155;
    border-radius: 16px;
    background: #1e2937;
    touch-action: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 100%;
    height: auto;
  }
  .ui {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ui div {
    background: #1e2937;
    padding: 6px 14px;
    border-radius: 8px;
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 4px;
  }
  button:active {
    background: #2563eb;
  }
  .win {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.96);
    padding: 32px 48px;
    border-radius: 20px;
    text-align: center;
    font-size: 26px;
    border: 2px solid #475569;
    z-index: 100;
    display: none;
    max-width: 90%;
  }
  .win h2 { margin: 0 0 12px; color: #4ade80; }
</style>
</head>
<body>

<h1>🎯 Peggle Proto</h1>
<div class="subtitle">Testaa suoraan puhelimella • Vedä ja päästä irti ampuaksesi</div>

<canvas id="game" width="400" height="620"></canvas>

<div class="ui">
  <div>Pisteet: <span id="score">0</span></div>
  <div>Laukaukset: <span id="shots">10</span></div>
  <div>Oranssit: <span id="oranges">0</span></div>
  <button onclick="resetLevel()">🔄 Uusi taso</button>
</div>

<div id="winMessage" class="win">
  <h2>✨ TASO LÄPI!</h2>
  <p id="finalScore" style="margin: 8px 0 20px; font-size: 20px;"></p>
  <button onclick="resetLevel()" style="background:#22c55e; padding:12px 28px; font-size:17px;">🚀 Seuraava taso</button>
</div>

<script>
// ==================== PEGGLE PROTO ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let ball = { x: 200, y: 80, vx: 0, vy: 0, radius: 9, active: false };
let pegs = [];
let score = 0;
let shots = 10;
let isAiming = false;
let aimStartX = 0;
let aimStartY = 0;

const GRAVITY = 0.185;
const FRICTION = 0.982;
const SHOOTER_Y = 75;

function initPegs() {
  pegs = [];
  const rows = 6;
  const cols = 7;
  const startY = 145;
  const spacingX = 48;
  const spacingY = 43;

  for (let row = 0; row < rows; row++) {
    const offset = (row % 2) * (spacingX / 2);
    for (let col = 0; col < cols; col++) {
      const x = 52 + offset + col * spacingX;
      const y = startY + row * spacingY;
      
      const isOrange = (row + col) % 2 === 0;
      
      pegs.push({
        x: x,
        y: y,
        radius: 11,
        hit: false,
        isOrange: isOrange
      });
    }
  }
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('shots').textContent = shots;
  
  const remainingOranges = pegs.filter(p => p.isOrange && !p.hit).length;
  document.getElementById('oranges').textContent = remainingOranges;
  
  if (remainingOranges === 0 && pegs.length > 0) {
    showWin();
  }
}

function showWin() {
  const winDiv = document.getElementById('winMessage');
  document.getElementById('finalScore').innerHTML = `Pisteet: <strong>${score}</strong>`;
  winDiv.style.display = 'block';
}

function resetLevel() {
  document.getElementById('winMessage').style.display = 'none';
  score = 0;
  shots = 10;
  ball.active = false;
  initPegs();
  updateUI();
}

function launchBall(angle, power) {
  if (shots <= 0 || ball.active) return;
  
  ball.x = 200;
  ball.y = SHOOTER_Y;
  ball.vx = Math.cos(angle) * power;
  ball.vy = Math.sin(angle) * power;
  ball.active = true;
  shots--;
  updateUI();
}

// ==================== FYSIIKKA ====================
function update() {
  if (!ball.active) return;

  ball.vy += GRAVITY;
  ball.vx *= FRICTION;
  ball.vy *= FRICTION;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Seinät
  if (ball.x - ball.radius < 12) {
    ball.x = 12 + ball.radius;
    ball.vx = -ball.vx * 0.82;
  }
  if (ball.x + ball.radius > 388) {
    ball.x = 388 - ball.radius;
    ball.vx = -ball.vx * 0.82;
  }
  if (ball.y - ball.radius < 8) {
    ball.y = 8 + ball.radius;
    ball.vy = -ball.vy * 0.65;
  }

  // Pohja
  if (ball.y > 635) {
    ball.active = false;
    updateUI();
    return;
  }

  // Törmäykset tappeihin
  for (let peg of pegs) {
    if (peg.hit) continue;

    const dx = ball.x - peg.x;
    const dy = ball.y - peg.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = ball.radius + peg.radius;

    if (dist < minDist && dist > 0) {
      peg.hit = true;
      
      const points = peg.isOrange ? 250 : 80;
      score += points;

      const nx = dx / dist;
      const ny = dy / dist;
      
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx = (ball.vx - 2 * dot * nx) * 0.9;
      ball.vy = (ball.vy - 2 * dot * ny) * 0.9;

      const overlap = minDist - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;

      updateUI();
      break;
    }
  }
}

// ==================== PIIRTO ====================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#1e2937';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Kehys
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, 390, 610);

  // Tapit
  for (let peg of pegs) {
    if (peg.hit) {
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }

    ctx.fillStyle = peg.isOrange ? '#f97316' : '#3b82f6';
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
    ctx.fill();

    // Kiilto
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(peg.x - 3, peg.y - 3, peg.radius * 0.38, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ampuja
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(200, SHOOTER_Y, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.arc(200, SHOOTER_Y, 7, 0, Math.PI * 2);
  ctx.fill();

  // Pallo
  if (ball.active) {
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(ball.x - 2.5, ball.y - 2.5, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tähtäysviiva
  if (isAiming) {
    const dx = aimStartX - 200;
    const dy = aimStartY - SHOOTER_Y;
    const angle = Math.atan2(dy, dx);
    
    ctx.strokeStyle = '#f1e7d2';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    ctx.moveTo(200, SHOOTER_Y);
    ctx.lineTo(200 + Math.cos(angle) * 130, SHOOTER_Y + Math.sin(angle) * 130);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (!ball.active && shots > 0) {
    ctx.fillStyle = '#64748b';
    ctx.font = '15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Vedä sormella yläosasta ja päästä irti', 200, 32);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ==================== OHJAUS ====================
function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

canvas.addEventListener('mousedown', startAim);
canvas.addEventListener('touchstart', startAim, { passive: false });

function startAim(e) {
  e.preventDefault();
  if (ball.active || shots <= 0) return;

  const pos = getEventPos(e);
  isAiming = true;
  aimStartX = pos.x;
  aimStartY = pos.y;
}

canvas.addEventListener('mousemove', moveAim);
canvas.addEventListener('touchmove', moveAim, { passive: false });

function moveAim(e) {
  if (!isAiming) return;
  e.preventDefault();
  const pos = getEventPos(e);
  aimStartX = pos.x;
  aimStartY = pos.y;
}

canvas.addEventListener('mouseup', endAim);
canvas.addEventListener('touchend', endAim);
canvas.addEventListener('mouseleave', endAim);

function endAim(e) {
  if (!isAiming) return;
  e.preventDefault();

  const dx = aimStartX - 200;
  const dy = aimStartY - SHOOTER_Y;
  const angle = Math.atan2(dy, dx);
  
  const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 150);
  const power = 6.8 + (distance / 150) * 5.2;

  launchBall(angle, power);
  isAiming = false;
}

// ==================== KÄYNNISTYS ====================
function startGame() {
  initPegs();
  gameLoop();
}

startGame();
</script>

</body>
</html>
